name: Check prices

on:
  schedule:
    - cron: "17 */4 * * *"  # price check 6x a day (off the hour: GitHub delays on-the-hour jobs most)
    - cron: "0 20 * * 0"    # weekly digest: Monday ~8–9am NZ time
  push:
    branches: [main]
    paths: [wishlist.yaml, retailers.yaml, dashboard/**, tracker/**]
  workflow_dispatch:
    inputs:
      digest:
        description: Also send the weekly digest
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TRACKER_LOG: INFO
      PYTHONUNBUFFERED: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest data, not the commit that triggered a queued run

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: pip install pytest && python -m pytest -q

      - name: Check prices
        if: github.event.schedule != '0 20 * * 0'
        run: python -m tracker check

      - name: Send weekly digest
        if: github.event.schedule == '0 20 * * 0' || inputs.digest
        run: python -m tracker digest

      - name: Commit price data
        run: |
          git config user.name "price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data wishlist.yaml
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update prices $(date -u +%Y-%m-%dT%H:%MZ)"
          # If another run pushed meanwhile, keep this run's (newer) data on conflict.
          git pull --rebase -X theirs origin main
          git push

      - name: Tell Telegram the check failed
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=❌ Price check failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" >/dev/null

      - name: Build dashboard
        run: python -m tracker build-site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
