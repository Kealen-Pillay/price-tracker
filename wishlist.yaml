# Wishlist — items to track. Edit by hand, from the dashboard, or via Telegram (/add, /link, /target, /remove).
# Each item lists one product URL per retailer. target_price (NZD) is optional: you get an alert when any retailer is at or below it.
# profile: who you're shopping for. gender skips products detected for other audiences (unisex/unlabelled kept).
# shoe_size applies to items with `kind: shoes`: stock and price come only from your sizes. brand_sizes overrides the
# built-in US->UK/EU conversion for a brand (half sizes a brand doesn't make map to both neighbouring sizes).
profile:
  gender: men
  shoe_size: {system: US, min: 10, max: 11.5}
  brand_sizes:
    Dr Martens: {UK: [9, 10]}
    Birkenstock: {EU: [43, 44], width: Regular}
    Salomon: {UK: [9.5, 11]}
  # Prices from comparison sites (PriceSpy) only count when they come from one of these shops, new and in stock.
  # Other sellers are shown on the dashboard but never set the price or alert.
  trusted_shops: [Chemist Warehouse, Farmers, Life Pharmacy, Unichem, Bargain Chemist, MECCA, Sephora,
    Ballantynes, David Jones, "Smith & Caughey's", PB Tech, JB Hi-Fi, Noel Leeming, Harvey Norman, Mighty Ape,
    Computer Lounge, Ascent, The Warehouse, Warehouse Stationery, JD Sports, Foot Locker, Platypus, Hype DC,
    Rebel Sport, Dr Martens, Birkenstock]
items:
